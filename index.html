<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Advocate Diary</title>
    <link rel="stylesheet" href="style.css?v=50.4">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#080b12">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="theme.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- LIQUID GLASS INDEX THEME --- */
        body {
            margin: 0;
            padding: 24px 16px;
            background: #080b12;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        /* Ambient Liquid Glow Orbs */
        .liquid-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.45;
            animation: floatOrb 14s ease-in-out infinite alternate;
        }
        .orb-index-1 {
            width: 440px;
            height: 440px;
            background: radial-gradient(circle, #4f46e5 0%, #3b82f6 100%);
            top: -120px;
            left: -100px;
        }
        .orb-index-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #8b5cf6 0%, #06b6d4 100%);
            bottom: -80px;
            right: -60px;
            animation-duration: 18s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(35px, 30px) scale(1.06); }
            100% { transform: translate(-30px, 20px) scale(0.95); }
        }

        /* Main Glass Container */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1350px;
            width: 100%;
            margin: 0 auto;
            background: rgba(18, 24, 38, 0.65) !important;
            backdrop-filter: blur(28px) saturate(190%) !important;
            -webkit-backdrop-filter: blur(28px) saturate(190%) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-top: 1px solid rgba(255, 255, 255, 0.2) !important;
            border-radius: 24px !important;
            padding: 32px 28px !important;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7) !important;
            box-sizing: border-box;
            animation: pageFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 24px;
            margin-bottom: 28px;
            gap: 20px;
            flex-wrap: wrap;
        }
        header h1 {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            font-size: 1.2em;
            filter: drop-shadow(0 4px 10px rgba(99, 102, 241, 0.4));
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #userEmail {
            background: rgba(255, 255, 255, 0.05);
            color: #818cf8;
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.88rem;
            white-space: nowrap;
        }

        .header-link {
            text-decoration: none;
            padding: 9px 16px;
            background: rgba(255, 255, 255, 0.06);
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.88rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .header-link:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            color: #ffffff;
        }

        .danger-link {
            color: #fca5a5 !important;
            border-color: rgba(239, 68, 68, 0.25) !important;
            background: rgba(239, 68, 68, 0.08) !important;
        }
        .danger-link:hover {
            background: rgba(239, 68, 68, 0.2) !important;
            border-color: rgba(239, 68, 68, 0.4) !important;
        }

        .print-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
            color: #ffffff !important;
            border: none !important;
            padding: 9px 18px !important;
            border-radius: 10px !important;
            font-family: 'Outfit', sans-serif !important;
            font-weight: 600 !important;
            font-size: 0.88rem !important;
            cursor: pointer !important;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25) !important;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
        }
        .print-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4) !important;
        }

        .notification-btn {
            padding: 9px 14px !important;
            font-size: 1.05rem !important;
        }

        #btnLogout {
            padding: 9px 18px;
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 10px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #btnLogout:hover {
            background: #ef4444;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(239, 68, 68, 0.35);
        }

        /* Controls Section (Date & Search) */
        .controls-wrapper {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.16);
            padding: 20px 24px;
            border-radius: 18px;
            align-items: flex-end;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .date-selector, .search-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .date-selector label, .search-container label {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.84rem;
            color: #94a3b8;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .date-selector { flex: 0 0 220px; }
        .search-container { flex: 1 1 280px; }

        .controls-wrapper input {
            height: 48px;
            padding: 0 16px;
            background: rgba(10, 14, 24, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .controls-wrapper input:focus {
            border-color: #6366f1;
            background: rgba(14, 20, 34, 0.85);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        #displayDate {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-top: 10px;
        }

        /* Glass Table */
        .table-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.4);
            margin-bottom: 36px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 950px;
        }
        th {
            background: rgba(255, 255, 255, 0.04);
            color: #94a3b8;
            padding: 16px 18px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-family: 'Outfit', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            white-space: nowrap;
        }
        td {
            padding: 16px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #f8fafc;
            vertical-align: middle;
            font-size: 0.92rem;
        }
        tbody tr:last-child td {
            border-bottom: none;
        }
        tbody tr {
            transition: background 0.2s ease;
        }
        tbody tr:hover {
            background: rgba(255, 255, 255, 0.035);
        }

        /* Add New Case Glass Footer Section */
        footer {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.16);
            padding: 28px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        footer h3 {
            margin: 0 0 20px 0;
            font-family: 'Outfit', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.01em;
        }

        #addCaseForm {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            align-items: end;
        }
        #addCaseForm input:not([type="color"]) {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            background: rgba(10, 14, 24, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.92rem;
            outline: none;
            box-sizing: border-box;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #addCaseForm input:focus {
            border-color: #6366f1;
            background: rgba(14, 20, 34, 0.85);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }
        #addCaseForm button[type="submit"] {
            height: 48px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 18px -4px rgba(79, 70, 229, 0.45);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #addCaseForm button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px -4px rgba(79, 70, 229, 0.6);
            filter: brightness(1.08);
        }

        /* Color Picker Polish */
        #caseColor, #editCaseColor {
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 10px !important;
            background: transparent !important;
        }

        /* Modal Frosted Glass */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(6, 8, 14, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        .modal-content {
            background: rgba(18, 24, 38, 0.88);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            margin: 6vh auto;
            padding: 32px 28px;
            width: 90%;
            max-width: 520px;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            position: relative;
            color: #ffffff;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8);
            animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 85vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.92); }
            100% { opacity: 1; transform: scale(1); }
        }

        .close-button {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #94a3b8;
            transition: all 0.2s;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
        }
        .close-button:hover {
            color: #f87171;
            background: rgba(239, 68, 68, 0.15);
            transform: rotate(90deg);
        }

        .modal-content h2 {
            margin: 0 0 20px 0;
            font-family: 'Outfit', sans-serif;
            font-size: 1.45rem;
            font-weight: 700;
            color: #ffffff;
        }

        #editCaseForm input:not([type="color"]) {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            background: rgba(10, 14, 24, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.92rem;
            outline: none;
            box-sizing: border-box;
            transition: all 0.2s;
        }
        #editCaseForm input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }
        #editCaseForm button {
            height: 48px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 6px 18px rgba(79, 70, 229, 0.4);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #editCaseForm button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(79, 70, 229, 0.55);
        }

        /* Footer */
        .global-footer {
            position: relative;
            z-index: 1;
            text-align: center;
            margin-top: 36px;
            color: #64748b;
            font-size: 0.88rem;
            line-height: 1.6;
        }
        .global-footer a {
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.2s;
        }
        .global-footer a:hover {
            color: #818cf8;
        }

        @media (max-width: 768px) {
            body { padding: 14px 10px; }
            .container { padding: 20px 14px !important; border-radius: 18px !important; }
            header { flex-direction: column; align-items: stretch; text-align: center; gap: 16px; }
            header h1 { justify-content: center; }
            .header-controls { flex-direction: column; width: 100%; align-items: stretch; }
            .header-link, #btnLogout, .print-btn, #userEmail, .notification-btn { width: 100%; box-sizing: border-box; justify-content: center; text-align: center; }
            .controls-wrapper { flex-direction: column; align-items: stretch; padding: 16px; }
            .date-selector, .search-container { flex: 1 1 auto; width: 100%; }
            #addCaseForm { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Liquid Ambient Glow Orbs -->
    <div class="liquid-orb orb-index-1"></div>
    <div class="liquid-orb orb-index-2"></div>

    <div class="container">
        <header>
            <h1><span class="logo-icon">⚖️</span> Advocate Diary</h1>
            <div class="header-controls">
                <span id="userEmail">Loading...</span>
                <a href="clients.html" class="header-link">👥 My Clients</a>
                <a href="dashboard.html" class="header-link">📊 Dashboard</a>
                <a href="recyclebin.html" class="header-link danger-link">♻️ Recycle Bin</a>
                <button id="btnPrint" class="print-btn">🖨️ Print List</button>
                <button id="btnInitNotifs" class="header-link notification-btn">🔔</button>
                <button id="btnLogout">Logout</button>
            </div>
        </header>

        <main>
            <div class="controls-wrapper">
                <div class="date-selector">
                    <label for="currentDate">Date:</label>
                    <input type="date" id="currentDate">
                </div>
                <div class="search-container">
                    <label for="searchInput">Search:</label>
                    <input type="text" id="searchInput" placeholder="Search Case/Party...">
                </div>
            </div>

            <div id="filterBadge" style="display:none; text-align:center; margin-bottom:14px;">
                <span style="background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color:white; padding:6px 18px; border-radius:50px; font-size:0.82rem; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; box-shadow:0 4px 12px rgba(79, 70, 229, 0.35);"></span>
                <a href="index.html" style="font-size:0.85rem; margin-left:12px; color:#818cf8; text-decoration:none; font-weight:600;">Clear Filter</a>
            </div>

            <h2 id="displayDate" style="text-align:center; color:#818cf8; margin-bottom: 22px; font-size: 1.5rem;">Cases</h2>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Prev Date</th>
                            <th>Case No</th>
                            <th>Year</th>
                            <th>Court</th>
                            <th>Nature</th>
                            <th>Party</th>
                            <th>Purpose</th>
                            <th>Next Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="caseTableBody"></tbody>
                </table>
            </div>

            <footer>
                <h3>Add New Case</h3>
                <form id="addCaseForm">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <label style="font-family:'Outfit', sans-serif; font-weight:600; font-size:0.85rem; color:#94a3b8;">Color:</label>
                        <input type="color" id="caseColor" value="#000000" style="width:50px; padding:4px; height:48px;">
                    </div>
                    <input type="text" id="caseNo" placeholder="Case No" required>
                    <input type="text" id="year" placeholder="Year" required>
                    <input type="text" id="courtName" placeholder="Court" required>
                    <input type="text" id="nature" placeholder="Nature">
                    <input type="text" id="partyName" placeholder="Party Name" list="clientList" required>
                    <datalist id="clientList"></datalist>
                    <input type="text" id="addDateFixedFor" placeholder="Purpose" required>
                    <div>
                        <label style="font-size:0.8rem; color:#94a3b8; font-family:'Outfit', sans-serif; font-weight:600; margin-left:2px; display:block; margin-bottom:4px;">First Date:</label>
                        <input type="date" id="firstDate" required>
                    </div>
                    <button type="submit">Add Case</button>
                </form>
            </footer>
        </main>
    </div>

    <!-- Edit Case Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="closeEditModal">&times;</span>
            <h2>Edit Case</h2>
            <form id="editCaseForm" style="display:grid; gap:14px;">
                <input type="hidden" id="editCaseId">
                <div style="display:flex; align-items:center; gap:10px;">
                    <label style="font-family:'Outfit', sans-serif; font-weight:600; font-size:0.85rem; color:#94a3b8;">Case Color:</label>
                    <input type="color" id="editCaseColor" style="width:60px; height:44px; padding:4px;">
                </div>
                <input type="text" id="editCaseNo" placeholder="Case No">
                <input type="text" id="editYear" placeholder="Year">
                <input type="text" id="editCourtName" placeholder="Court">
                <input type="text" id="editNature" placeholder="Nature">
                <input type="text" id="editPartyName" placeholder="Party Name">
                <div>
                    <label style="font-size:0.8rem; color:#94a3b8; font-family:'Outfit', sans-serif; font-weight:600; margin-left:2px; display:block; margin-bottom:4px;">Previous Date:</label>
                    <input type="date" id="editPreviousDate">
                </div>
                <input type="text" id="editDateFixedFor" placeholder="Purpose">
                <div>
                    <label style="font-size:0.8rem; color:#94a3b8; font-family:'Outfit', sans-serif; font-weight:600; margin-left:2px; display:block; margin-bottom:4px;">Next Date:</label>
                    <input type="date" id="editNextDate">
                </div>
                <button type="submit">Update Case</button>
            </form>
        </div>
    </div>

    <div class="global-footer">
        <p>Created with ❤️ by Yeash Pandey & Alfi khan</p>
        <p>
            <a href="updates.html">App Updates</a> &bull; 
            <a href="policy.html">Privacy Policy</a> &bull; 
            <a href="about.html">About Developers</a> &bull; 
            <a href="mailto:contact.advocatediary@gmail.com">Contact Us</a>
        </p>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyBpe3oaDibo7Y9ZaPxf5hJtRyI6PhTY344", 
            authDomain: "advocate-diary-co.firebaseapp.com", 
            projectId: "advocate-diary-co", 
            storageBucket: "advocate-diary-co.appspot.com", 
            messagingSenderId: "809588634104", 
            appId: "1:809588634104:web:f5d4838294ad602aeb660d" 
        }; 
        firebase.initializeApp(firebaseConfig);
    </script>
    <script src="script.js"></script>
    <script>
        // Filter logic handling
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const filter = urlParams.get('filter');
            if(filter) {
                const badge = document.getElementById('filterBadge');
                badge.style.display = 'block';
                badge.querySelector('span').textContent = "Viewing: " + filter;
            }
        });
    </script>
</body>
</html>

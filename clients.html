<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Clients - Advocate Diary</title>
    <link rel="stylesheet" href="style.css?v=51.1">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#080b12">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="theme.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- LIQUID GLASS CLIENTS PAGE THEME --- */
        body {
            margin: 0;
            padding: 24px 16px;
            background: #080b12;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        /* Ambient Liquid Glow Orbs */
        .liquid-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.45;
            animation: floatOrb 14s ease-in-out infinite alternate;
        }
        .orb-clients-1 {
            width: 440px;
            height: 440px;
            background: radial-gradient(circle, #4f46e5 0%, #3b82f6 100%);
            top: -120px;
            left: -100px;
        }
        .orb-clients-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #8b5cf6 0%, #ec4899 100%);
            bottom: -80px;
            right: -60px;
            animation-duration: 18s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(35px, 30px) scale(1.06); }
            100% { transform: translate(-30px, 20px) scale(0.95); }
        }

        /* Liquid Glass Container */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1250px;
            width: 100%;
            margin: 0 auto;
            background: rgba(18, 24, 38, 0.65) !important;
            backdrop-filter: blur(28px) saturate(190%) !important;
            -webkit-backdrop-filter: blur(28px) saturate(190%) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-top: 1px solid rgba(255, 255, 255, 0.2) !important;
            border-radius: 24px !important;
            padding: 32px 28px !important;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7) !important;
            box-sizing: border-box;
            animation: pageFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 24px;
            margin-bottom: 28px;
            gap: 20px;
            flex-wrap: wrap;
        }
        header h1 {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            font-size: 1.2em;
            filter: drop-shadow(0 4px 10px rgba(99, 102, 241, 0.4));
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #userEmail {
            background: rgba(255, 255, 255, 0.05);
            color: #818cf8;
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.88rem;
            white-space: nowrap;
        }

        .header-link {
            text-decoration: none;
            padding: 9px 16px;
            background: rgba(255, 255, 255, 0.06);
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.88rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .header-link:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            color: #ffffff;
        }

        #btnLogout {
            padding: 9px 18px;
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 10px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #btnLogout:hover {
            background: #ef4444;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(239, 68, 68, 0.35);
        }

        /* Form Sub-Container */
        .client-form-container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.16);
            padding: 24px;
            border-radius: 18px;
            margin-bottom: 28px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .client-form-container h3 {
            margin: 0 0 16px 0;
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.01em;
        }

        #addClientForm {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            align-items: end;
        }
        #addClientForm input {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            background: rgba(10, 14, 24, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.92rem;
            outline: none;
            box-sizing: border-box;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #addClientForm input:focus {
            border-color: #6366f1;
            background: rgba(14, 20, 34, 0.85);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }
        #addClientForm button {
            height: 48px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 18px -4px rgba(79, 70, 229, 0.45);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #addClientForm button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px -4px rgba(79, 70, 229, 0.6);
            filter: brightness(1.08);
        }
        #addClientForm button:active {
            transform: scale(0.98);
        }

        /* Search Input */
        .client-search {
            width: 100%;
            height: 50px;
            padding: 0 18px;
            margin: 18px 0 22px 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: rgba(10, 14, 24, 0.65);
            color: #ffffff;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .client-search:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
            background: rgba(14, 20, 34, 0.85);
        }

        /* Glass Table */
        .table-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.4);
            margin-bottom: 24px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 680px;
        }
        th {
            background: rgba(255, 255, 255, 0.04);
            color: #94a3b8;
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-family: 'Outfit', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            white-space: nowrap;
        }
        td {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #f8fafc;
            vertical-align: middle;
            font-size: 0.92rem;
        }
        tbody tr:last-child td {
            border-bottom: none;
        }
        tbody tr {
            transition: background 0.2s ease;
        }
        tbody tr:hover {
            background: rgba(255, 255, 255, 0.035);
        }

        /* Tactile Apple-Style Badges */
        .case-badge {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.25) 0%, rgba(59, 130, 246, 0.3) 100%);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: #c7d2fe;
            padding: 6px 14px;
            border-radius: 50px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }
        .case-badge:hover {
            transform: translateY(-1px) scale(1.04);
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.45) 0%, rgba(59, 130, 246, 0.5) 100%);
            border-color: rgba(99, 102, 241, 0.7);
            color: #ffffff;
            box-shadow: 0 6px 18px rgba(79, 70, 229, 0.35);
        }
        .case-badge:active {
            transform: scale(0.96);
        }

        .zero-cases {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
            color: #64748b;
            cursor: default;
            box-shadow: none;
        }
        .zero-cases:hover {
            transform: none;
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
            color: #64748b;
            box-shadow: none;
        }

        /* Action Buttons */
        .action-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .action-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .action-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
        }
        .action-btn:active {
            transform: scale(0.94);
        }

        /* Glass Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(6, 8, 14, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        .modal-content {
            background: rgba(18, 24, 38, 0.88);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            margin: 8vh auto;
            padding: 32px 28px;
            width: 90%;
            max-width: 480px;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            position: relative;
            color: #ffffff;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8);
            animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-sizing: border-box;
        }

        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.92); }
            100% { opacity: 1; transform: scale(1); }
        }

        .close-button {
            position: absolute;
            right: 20px;
            top: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #94a3b8;
            transition: all 0.2s;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
        }
        .close-button:hover {
            color: #f87171;
            background: rgba(239, 68, 68, 0.15);
            transform: rotate(90deg);
        }

        .modal-content h2 {
            margin: 0 0 20px 0;
            font-family: 'Outfit', sans-serif;
            font-size: 1.45rem;
            font-weight: 700;
            color: #ffffff;
        }

        #editClientForm input {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            background: rgba(10, 14, 24, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
            transition: all 0.2s;
        }
        #editClientForm input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }
        #editClientForm button {
            height: 48px;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 6px 18px rgba(79, 70, 229, 0.4);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #editClientForm button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(79, 70, 229, 0.55);
        }

        /* Footer */
        .global-footer {
            position: relative;
            z-index: 1;
            text-align: center;
            margin-top: 36px;
            color: #64748b;
            font-size: 0.88rem;
        }
        .global-footer p {
            margin: 4px 0;
        }

        @media (max-width: 768px) {
            body { padding: 14px 10px; }
            .container { padding: 22px 16px !important; border-radius: 18px !important; }
            header { flex-direction: column; align-items: stretch; text-align: center; gap: 16px; }
            header h1 { justify-content: center; }
            .header-controls { flex-direction: column; width: 100%; align-items: stretch; }
            .header-link, #btnLogout, #userEmail { text-align: center; width: 100%; box-sizing: border-box; }
            #addClientForm { grid-template-columns: 1fr; }
            table { min-width: 580px; }
        }
    </style>
</head>
<body>

    <!-- Liquid Ambient Glow Elements -->
    <div class="liquid-orb orb-clients-1"></div>
    <div class="liquid-orb orb-clients-2"></div>

    <div class="container">
        <header>
            <h1><span class="logo-icon">👥</span> My Clients</h1>
            <div class="header-controls">
                <span id="userEmail">Loading...</span> 
                <button id="btnLogout">Logout</button>
            </div>
        </header>
        <main>
            <div class="client-form-container">
                <h3>Add New Client</h3>
                <form id="addClientForm">
                    <input type="text" id="clientName" placeholder="Full Name" required>
                    <input type="tel" id="clientMobile" placeholder="Mobile Number" required>
                    <input type="email" id="clientEmail" placeholder="Email (Optional)">
                    <input type="text" id="clientAddress" placeholder="Address (Optional)">
                    <button type="submit">Save Client</button>
                </form>
                <p id="clientFormSuccess" style="display:none; color:#34d399; margin-top:12px; font-weight:600;">✅ Client Saved!</p>
            </div>

            <h3 style="color:#ffffff; margin-top:30px; font-family:'Outfit', sans-serif; font-size:1.3rem;">Saved Clients List</h3>
            <input type="text" id="clientSearchInput" class="client-search" placeholder="🔍 Search clients by name or mobile...">
            
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Active Cases</th>
                            <th>Mobile</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="clientTableBody">
                        <tr><td colspan="4" style="text-align:center; padding: 28px; color: #94a3b8;">Loading data...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Edit Client Modal -->
    <div id="editClientModal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="closeEditClientModal">&times;</span>
            <h2>Edit Client</h2>
            <form id="editClientForm" style="display:grid; gap:14px;">
                <input type="hidden" id="editClientId">
                <input type="text" id="editClientName" placeholder="Name" required>
                <input type="tel" id="editClientMobile" placeholder="Mobile" required>
                <input type="email" id="editClientEmail" placeholder="Email">
                <input type="text" id="editClientAddress" placeholder="Address">
                <button type="submit">Update Client</button>
            </form>
        </div>
    </div>
    
    <div class="global-footer">
    <p>Created with ❤️ by Yeash Pandey & Alfi khan</p>
    <p> 
        <a href="updates.html">App Updates</a> &bull; 
        <a href="policy.html">Privacy Policy</a> &bull; 
        <a href="about.html">About Developers</a> &bull; 
        <a href="mailto:contact.advocatediary@gmail.com">Contact Us</a>
    </p>
</div>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <script>
        // CONFIG
        const firebaseConfig = { 
            apiKey: "AIzaSyBpe3oaDibo7Y9ZaPxf5hJtRyI6PhTY344", 
            authDomain: "advocate-diary-co.firebaseapp.com", 
            projectId: "advocate-diary-co", 
            storageBucket: "advocate-diary-co.appspot.com", 
            messagingSenderId: "809588634104", 
            appId: "1:809588634104:web:f5d4838294ad602aeb660d", 
            measurementId: "G-53VM0EZCWC" 
        }; 
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let userClientsRef = null;
        let userCasesRef = null;
        let allClients = [];
        let caseCounts = {}; // To store count per client name

        // AUTH & INIT
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                // Name Display
                let name = user.displayName || user.email.split('@')[0];
                document.getElementById('userEmail').textContent = "👋 " + name.charAt(0).toUpperCase() + name.slice(1);
                
                // Set Refs
                userClientsRef = db.collection('users').doc(user.uid).collection('clients');
                userCasesRef = db.collection('users').doc(user.uid).collection('cases');
                
                // First Load Case Counts
                await calculateCaseCounts();
                // Then Load Clients
                loadClients();
            } else {
                window.location.href = 'login.html';
            }
        });

        document.getElementById('btnLogout').addEventListener('click', async () => {
            const confirmed = window.glassConfirm 
                ? await window.glassConfirm("Sign Out", "Are you sure you want to log out?", "Logout", true)
                : confirm("Are you sure you want to log out?");
            if (confirmed) auth.signOut();
        });

        // LOGIC: Calculate Cases per Client
        async function calculateCaseCounts() {
            try {
                // Get ALL active cases
                const snap = await userCasesRef.where('isDeleted', '==', false).get();
                caseCounts = {}; // Reset

                snap.forEach(doc => {
                    const c = doc.data();
                    if(c.partyName) {
                        // Normalize name (lowercase, trim) to match correctly
                        const key = c.partyName.trim().toLowerCase();
                        if(!caseCounts[key]) caseCounts[key] = 0;
                        if(!c.isClosed) caseCounts[key]++; // Only count active cases
                    }
                });
            } catch(err) { console.error("Count Error", err); }
        }

        // CLIENT CRUD
        function loadClients() {
            userClientsRef.where('isDeleted', '==', false).orderBy('name').onSnapshot(snap => {
                allClients = snap.docs.map(d => ({id: d.id, ...d.data()}));
                renderTable(allClients);
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('clientTableBody');
            tbody.innerHTML = '';
            
            if(data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 24px; color: #94a3b8;">No clients found. Add one above.</td></tr>';
                return;
            }

            data.forEach(client => {
                const tr = document.createElement('tr');
                
                // Match Count
                const key = client.name.trim().toLowerCase();
                const count = caseCounts[key] || 0;
                
                const badgeClass = count > 0 ? 'case-badge' : 'case-badge zero-cases';
                const badgeText = count > 0 ? `${count} Cases 📂` : 'No Active Cases';
                
                // OnClick: Go to Index with search filter (Only if cases exist)
                const badgeAction = count > 0 ? `onclick="window.location.href='index.html?search=${encodeURIComponent(client.name)}'"` : '';
                const badgeTitle = count > 0 ? "Click to view case list" : "No active cases";

                tr.innerHTML = `
                    <td><strong style="font-size:0.96rem; color:#ffffff;">${client.name}</strong><br><small style="color:#94a3b8;">${client.email || ''}</small></td>
                    <td>
                        <div class="${badgeClass}" ${badgeAction} title="${badgeTitle}">
                            ${badgeText}
                        </div>
                    </td>
                    <td><a href="tel:${client.mobile}" style="text-decoration:none; color:#818cf8; font-weight:500;">${client.mobile}</a></td>
                    <td>
                        <div class="action-row">
                            <button class="action-btn edit-btn" onclick="openEdit('${client.id}')" title="Edit Client">✏️</button>
                            <button class="action-btn delete-btn" onclick="deleteClient('${client.id}')" title="Delete Client">🗑️</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ADD CLIENT
        document.getElementById('addClientForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('clientName').value,
                mobile: document.getElementById('clientMobile').value,
                email: document.getElementById('clientEmail').value,
                address: document.getElementById('clientAddress').value,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                isDeleted: false
            };
            await userClientsRef.add(data);
            e.target.reset();
            const successMsg = document.getElementById('clientFormSuccess');
            successMsg.style.display = 'block';
            setTimeout(() => successMsg.style.display = 'none', 3000);
        });

        // EDIT & DELETE (LIQUID GLASS CONFIRM DIALOG)
        window.deleteClient = async (id) => {
            const confirmed = window.glassConfirm 
                ? await window.glassConfirm("Delete Client?", "Move this client to Recycle Bin?", "Move to Bin", true)
                : confirm("Delete this client?");

            if(confirmed) {
                await userClientsRef.doc(id).update({isDeleted: true});
                if (window.showGlassToast) window.showGlassToast("Client moved to Recycle Bin", "warning");
            }
        };

        const modal = document.getElementById('editClientModal');
        window.openEdit = async (id) => {
            const doc = await userClientsRef.doc(id).get();
            const d = doc.data();
            document.getElementById('editClientId').value = id;
            document.getElementById('editClientName').value = d.name;
            document.getElementById('editClientMobile').value = d.mobile;
            document.getElementById('editClientEmail').value = d.email || '';
            document.getElementById('editClientAddress').value = d.address || '';
            modal.style.display = 'block';
        };

        document.getElementById('editClientForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editClientId').value;
            await userClientsRef.doc(id).update({
                name: document.getElementById('editClientName').value,
                mobile: document.getElementById('editClientMobile').value,
                email: document.getElementById('editClientEmail').value,
                address: document.getElementById('editClientAddress').value
            });
            modal.style.display = 'none';
            if (window.showGlassToast) window.showGlassToast("Client updated successfully!", "success");
        });

        document.getElementById('closeEditClientModal').onclick = () => modal.style.display = 'none';
        window.onclick = (e) => { if (e.target == modal) modal.style.display = 'none'; };

        // SEARCH FILTER
        document.getElementById('clientSearchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allClients.filter(c => c.name.toLowerCase().includes(term) || c.mobile.includes(term));
            renderTable(filtered);
        });
    </script>
</body>
</html>

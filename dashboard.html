<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - Advocate Diary</title>
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="stylesheet" href="style.css?v=50.2">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* --- LIQUID GLASS DASHBOARD THEME --- */
        body {
            margin: 0;
            padding: 24px 16px;
            background: #080b12;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        /* Ambient Liquid Glow Orbs */
        .liquid-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.45;
            animation: floatOrb 14s ease-in-out infinite alternate;
        }
        .orb-top {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #4f46e5 0%, #3b82f6 100%);
            top: -120px;
            left: -100px;
        }
        .orb-bottom {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, #8b5cf6 0%, #06b6d4 100%);
            bottom: -100px;
            right: -80px;
            animation-duration: 18s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, 30px) scale(1.05); }
            100% { transform: translate(-30px, 20px) scale(0.95); }
        }

        /* Frosted Glass Main Container */
        .dashboard-container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(18, 24, 38, 0.65);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7);
            animation: pageFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header Styling */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 24px;
            margin-bottom: 32px;
            gap: 20px;
            flex-wrap: wrap;
        }
        .dash-title h1 {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.6rem, 4vw, 2.1rem);
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
        }
        .dash-title p {
            margin: 6px 0 0 0;
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .dash-title #adminName {
            color: #818cf8;
            font-weight: 600;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* Buttons */
        .btn-export {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
            color: #ffffff !important;
            border: none !important;
            padding: 10px 20px !important;
            border-radius: 12px !important;
            font-family: 'Outfit', sans-serif !important;
            font-weight: 600 !important;
            font-size: 0.92rem !important;
            cursor: pointer !important;
            display: inline-flex !important;
            align-items: center !important;
            gap: 8px !important;
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.3) !important;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
        }
        .btn-export:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(16, 185, 129, 0.45) !important;
            filter: brightness(1.08);
        }

        .btn-back {
            text-decoration: none !important;
            padding: 10px 20px !important;
            background: rgba(255, 255, 255, 0.08) !important;
            color: #f8fafc !important;
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            border-radius: 12px !important;
            font-family: 'Outfit', sans-serif !important;
            font-weight: 600 !important;
            font-size: 0.92rem !important;
            display: inline-flex !important;
            align-items: center !important;
            gap: 6px !important;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
        }
        .btn-back:hover {
            background: rgba(255, 255, 255, 0.15) !important;
            border-color: rgba(255, 255, 255, 0.3) !important;
            transform: translateY(-2px);
        }

        /* Stats Grid with Tactile Liquid Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
            margin-bottom: 36px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.04) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 18px !important;
            padding: 22px 24px !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-top: 1px solid rgba(255, 255, 255, 0.18) !important;
            box-shadow: 0 10px 24px -5px rgba(0, 0, 0, 0.4) !important;
            cursor: pointer;
            transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1) !important;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        .stat-card:hover {
            transform: translateY(-4px) scale(1.015) !important;
            box-shadow: 0 18px 32px -6px rgba(0, 0, 0, 0.55) !important;
        }
        .stat-card:active {
            transform: scale(0.97) !important;
        }

        /* Color Accents for Cards */
        .card-blue:hover { border-color: rgba(59, 130, 246, 0.5) !important; }
        .card-orange:hover { border-color: rgba(245, 158, 11, 0.5) !important; }
        .card-green:hover { border-color: rgba(16, 185, 129, 0.5) !important; }
        .card-purple:hover { border-color: rgba(168, 85, 247, 0.5) !important; }

        .stat-info h3 {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
        }
        .stat-info p {
            margin: 4px 0 0 0;
            color: #94a3b8;
            font-size: 0.92rem;
            font-weight: 500;
        }

        .stat-icon {
            font-size: 1.8rem;
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.2));
        }

        /* Charts Wrapper */
        .charts-wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 24px;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 20px;
            padding: 24px;
            height: 360px !important;
            position: relative;
            box-shadow: 0 12px 30px -8px rgba(0, 0, 0, 0.45);
        }
        .chart-header {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 18px;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Frosted Glass Loader */
        .loader-overlay {
            position: fixed;
            inset: 0;
            background: rgba(8, 11, 18, 0.85);
            backdrop-filter: blur(16px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        .loader-overlay p {
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 600;
            color: #e2e8f0;
            margin: 0;
        }

        /* Footer */
        .global-footer {
            position: relative;
            z-index: 1;
            text-align: center;
            margin-top: 36px;
            color: #64748b;
            font-size: 0.88rem;
            line-height: 1.6;
        }
        .global-footer a {
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.2s;
        }
        .global-footer a:hover {
            color: #818cf8;
        }

        @media (max-width: 768px) {
            body { padding: 14px 10px; }
            .dashboard-container { padding: 22px 16px; border-radius: 18px; }
            .charts-wrapper { grid-template-columns: 1fr !important; }
            .chart-container { height: 320px !important; padding: 18px 14px; }
            .dashboard-header { flex-direction: column; align-items: flex-start; gap: 16px; }
            .header-controls { width: 100%; justify-content: space-between; }
            .btn-export, .btn-back { flex: 1; justify-content: center; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- Ambient Liquid Orbs -->
    <div class="liquid-orb orb-top"></div>
    <div class="liquid-orb orb-bottom"></div>

    <div id="loader" class="loader-overlay">
        <div style="font-size: 3rem; animation: pulse 1.5s infinite alternate;">📊</div>
        <p>Analyzing Data...</p>
    </div>

    <div class="dashboard-container">
        <header class="dashboard-header">
            <div class="dash-title">
                <h1>Analytics Dashboard</h1>
                <p>Welcome back, <span id="adminName">Advocate</span></p>
            </div>
            <div class="header-controls">
                <button onclick="downloadCSV()" class="btn-export">⬇ Export CSV</button>
                <a href="index.html" class="btn-back">⬅ Back</a>
            </div>
        </header>

        <section class="stats-grid">
            <div class="stat-card card-blue" onclick="window.location.href='index.html?filter=all'">
                <div class="stat-info">
                    <h3 id="statTotal">0</h3>
                    <p>Total Cases</p>
                </div>
                <div class="stat-icon">📂</div>
            </div>
            <div class="stat-card card-orange" onclick="window.location.href='index.html?filter=active'">
                <div class="stat-info">
                    <h3 id="statActive">0</h3>
                    <p>Active Cases</p>
                </div>
                <div class="stat-icon">⚖️</div>
            </div>
            <div class="stat-card card-green" onclick="window.location.href='index.html?filter=closed'">
                <div class="stat-info">
                    <h3 id="statClosed">0</h3>
                    <p>Decided Cases</p>
                </div>
                <div class="stat-icon">✅</div>
            </div>
            <div class="stat-card card-purple" onclick="window.location.href='clients.html'">
                <div class="stat-info">
                    <h3 id="statClients">0</h3>
                    <p>Clients</p>
                </div>
                <div class="stat-icon">👥</div>
            </div>
        </section>

        <section class="charts-wrapper">
            <div class="chart-container">
                <div class="chart-header">Case Status Ratio</div>
                <canvas id="statusChart"></canvas>
            </div>
            <div class="chart-container">
                <div class="chart-header">Case Volume (By Nature)</div>
                <canvas id="natureChart"></canvas>
            </div>
        </section>
    </div>

    <div class="global-footer">
        <p>Created with ❤️ by Yeash Pandey & Alfi khan</p>
        <p>
            <a href="updates.html">App Updates</a> &bull; 
            <a href="policy.html">Privacy Policy</a> &bull; 
            <a href="about.html">About Developers</a> &bull; 
            <a href="mailto:contact.advocatediary@gmail.com">Contact Us</a>
        </p>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="theme.js"></script>
    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyBpe3oaDibo7Y9ZaPxf5hJtRyI6PhTY344", 
            authDomain: "advocate-diary-co.firebaseapp.com", 
            projectId: "advocate-diary-co", 
            storageBucket: "advocate-diary-co.appspot.com", 
            messagingSenderId: "809588634104", 
            appId: "1:809588634104:web:f5d4838294ad602aeb660d" 
        };
        firebase.initializeApp(firebaseConfig);

        async function downloadCSV() {
            const uid = firebase.auth().currentUser.uid;
            const casesSnap = await firebase.firestore().collection('users').doc(uid).collection('cases').get();
            let csv = "Case No,Year,Court,Nature,Party Name,Status,Date\n";
            casesSnap.forEach(doc => { 
                const c = doc.data(); 
                csv += `${c.caseNo},${c.year},"${c.courtName}","${c.nature}","${c.partyName}",${c.isClosed?"Closed":"Active"},${c.current_date}\n`; 
            });
            const link = document.createElement("a");
            link.href = encodeURI("data:text/csv;charset=utf-8," + csv);
            link.download = "Advocate_Diary_Report.csv";
            link.click();
        }

        document.addEventListener('DOMContentLoaded', () => {
            firebase.auth().onAuthStateChanged(user => {
                if (user) {
                    document.getElementById('adminName').textContent = user.displayName || user.email.split('@')[0];
                    loadAnalytics(user.uid);
                } else { 
                    window.location.href = 'login.html'; 
                }
            });

            async function loadAnalytics(uid) {
                const db = firebase.firestore();
                const [casesSnap, clientsSnap] = await Promise.all([
                    db.collection('users').doc(uid).collection('cases').where('isDeleted', '==', false).get(),
                    db.collection('users').doc(uid).collection('clients').where('isDeleted', '==', false).get()
                ]);
                const cases = casesSnap.docs.map(d => d.data());
                const closed = cases.filter(c => c.isClosed).length;
                animateCounter("statTotal", cases.length); 
                animateCounter("statActive", cases.length - closed);
                animateCounter("statClosed", closed); 
                animateCounter("statClients", clientsSnap.size);
                
                const natureCounts = {};
                cases.forEach(c => { 
                    const n = c.nature || "Other"; 
                    natureCounts[n] = (natureCounts[n] || 0) + 1; 
                });
                renderCharts(cases.length - closed, closed, natureCounts);
                document.getElementById('loader').style.display = 'none';
            }

            function renderCharts(active, closed, nature) {
                Chart.defaults.color = '#94a3b8';
                Chart.defaults.font.family = "'Plus Jakarta Sans', sans-serif";

                new Chart(document.getElementById('statusChart').getContext('2d'), { 
                    type: 'doughnut', 
                    data: { 
                        labels: ['Active Cases', 'Decided Cases'], 
                        datasets: [{ 
                            data: [active, closed], 
                            backgroundColor: ['#f59e0b', '#10b981'],
                            borderColor: 'rgba(18, 24, 38, 0.9)',
                            borderWidth: 3,
                            hoverOffset: 6
                        }] 
                    },
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom', labels: { boxWidth: 14, padding: 16 } }
                        }
                    }
                });

                new Chart(document.getElementById('natureChart').getContext('2d'), { 
                    type: 'bar', 
                    data: { 
                        labels: Object.keys(nature), 
                        datasets: [{ 
                            label: 'Cases', 
                            data: Object.values(nature), 
                            backgroundColor: '#6366f1',
                            borderRadius: 8,
                            borderSkipped: false
                        }] 
                    },
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: { 
                            x: { 
                                grid: { display: false },
                                ticks: { maxRotation: 45, minRotation: 45, color: '#94a3b8' } 
                            },
                            y: {
                                grid: { color: 'rgba(255, 255, 255, 0.06)' },
                                ticks: { precision: 0, color: '#94a3b8' }
                            }
                        }
                    }
                });
            }

            function animateCounter(id, target) {
                const el = document.getElementById(id); 
                let curr = 0;
                const timer = setInterval(() => { 
                    curr += Math.ceil(target/20) || 1; 
                    if(curr >= target) { 
                        el.textContent = target; 
                        clearInterval(timer); 
                    } else {
                        el.textContent = curr; 
                    }
                }, 30);
            }
        });
    </script>
</body>
</html>

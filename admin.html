<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Panel - Advocate Diary</title>
    <link rel="stylesheet" href="style.css?v=52.0">
    <link rel="icon" type="image/png" href="icon-192.png">
    <script src="theme.js?v=52.0"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- LIQUID GLASS ADMIN THEME --- */
        body {
            margin: 0;
            padding: 24px 16px;
            background: #080b12;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        /* Ambient Liquid Glow Orbs */
        .liquid-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.45;
            animation: floatOrb 14s ease-in-out infinite alternate;
        }
        .orb-admin-1 {
            width: 440px;
            height: 440px;
            background: radial-gradient(circle, #f59e0b 0%, #ef4444 100%);
            top: -120px;
            left: -100px;
        }
        .orb-admin-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #6366f1 0%, #8b5cf6 100%);
            bottom: -80px;
            right: -60px;
            animation-duration: 18s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(35px, 30px) scale(1.06); }
            100% { transform: translate(-30px, 20px) scale(0.95); }
        }

        /* Main Glass Container */
        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            background: rgba(18, 24, 38, 0.65) !important;
            backdrop-filter: blur(28px) saturate(190%) !important;
            -webkit-backdrop-filter: blur(28px) saturate(190%) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-top: 1px solid rgba(255, 255, 255, 0.2) !important;
            border-radius: 24px !important;
            padding: 32px 28px !important;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7) !important;
            box-sizing: border-box;
            animation: pageFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 24px;
            margin-bottom: 28px;
            gap: 20px;
            flex-wrap: wrap;
        }
        header h1 {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.6rem, 4vw, 2.1rem);
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-link {
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.06);
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.92rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .header-link:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            color: #ffffff;
        }

        /* Stats Sub-Bar */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.16);
            padding: 18px 24px;
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .stats-bar h3 {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 600;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #totalUsers {
            font-size: 1.4rem;
            font-weight: 700;
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 2px 14px;
            border-radius: 50px;
        }

        /* Admin Glass Table */
        .admin-table-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.4);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 720px;
        }
        th {
            background: rgba(255, 255, 255, 0.04);
            color: #94a3b8;
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-family: 'Outfit', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            white-space: nowrap;
        }
        td {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #f8fafc;
            vertical-align: middle;
            font-size: 0.92rem;
        }
        tbody tr:last-child td {
            border-bottom: none;
        }
        tbody tr {
            transition: background 0.2s ease;
        }
        tbody tr:hover {
            background: rgba(255, 255, 255, 0.035);
        }

        /* Apple-Style Glass Badges */
        .badge {
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
            font-family: 'Outfit', sans-serif;
            letter-spacing: 0.02em;
        }
        .bg-green {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .bg-gray {
            background: rgba(148, 163, 184, 0.12);
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.25);
        }

        /* Action Button */
        .btn-spy {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%) !important;
            color: #ffffff !important;
            border: none !important;
            padding: 7px 15px !important;
            border-radius: 10px !important;
            font-family: 'Outfit', sans-serif !important;
            font-size: 0.86rem !important;
            font-weight: 600 !important;
            cursor: pointer !important;
            display: inline-flex !important;
            align-items: center !important;
            gap: 6px !important;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3) !important;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
        }
        .btn-spy:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.5) !important;
            filter: brightness(1.08);
        }
        .btn-spy:active {
            transform: scale(0.96);
        }

        /* Access Denied Card */
        .denied-card {
            background: rgba(18, 24, 38, 0.85);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            margin: 15vh auto;
            text-align: center;
            color: #f87171;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
        }

        @media (max-width: 768px) {
            body { padding: 14px 10px; }
            .container { padding: 20px 14px !important; border-radius: 18px !important; }
            header { flex-direction: column; align-items: stretch; text-align: center; gap: 14px; }
            header h1 { justify-content: center; }
            .header-controls { justify-content: center; width: 100%; }
            .header-link { width: 100%; justify-content: center; }
            table { min-width: 580px; }
        }
    </style>
</head>
<body>

    <!-- Liquid Ambient Glow Elements -->
    <div class="liquid-orb orb-admin-1"></div>
    <div class="liquid-orb orb-admin-2"></div>

    <div class="container">
        <header>
            <h1>👑 Admin Control Panel</h1>
            <div class="header-controls">
                <a href="index.html" class="header-link">⬅ Back</a>
            </div>
        </header>

        <main>
            <div class="stats-bar">
                <h3>👥 Registered System Users</h3>
                <div>Total Users: <span id="totalUsers">Loading...</span></div>
            </div>

            <div class="admin-table-container">
                <table id="usersTable">
                    <thead>
                        <tr>
                            <th>User Email</th>
                            <th>Joined</th>
                            <th>Last Active</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="usersList">
                        <tr><td colspan="4" style="text-align:center; padding:24px; color:#94a3b8;">Loading user registry...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyBpe3oaDibo7Y9ZaPxf5hJtRyI6PhTY344", 
            authDomain: "advocate-diary-co.firebaseapp.com", 
            projectId: "advocate-diary-co", 
            storageBucket: "advocate-diary-co.appspot.com", 
            messagingSenderId: "809588634104", 
            appId: "1:809588634104:web:f5d4838294ad602aeb660d", 
            measurementId: "G-53VM0EZCWC" 
        };
        firebase.initializeApp(firebaseConfig);
        
        const auth = firebase.auth();
        const db = firebase.firestore();

        auth.onAuthStateChanged(user => {
            if(user && user.email === "contact.advocatediary@gmail.com") {
                loadUsers();
            } else {
                document.body.innerHTML = `
                    <div class="denied-card">
                        <div style="font-size: 3rem; margin-bottom: 12px;">⛔</div>
                        <h2 style="margin: 0; font-family: 'Outfit', sans-serif;">Access Denied</h2>
                        <p style="color: #94a3b8; font-size: 0.9rem; margin-top: 8px;">Only authorized administrators can access this terminal.</p>
                    </div>
                `;
                setTimeout(() => window.location.href = 'index.html', 1800);
            }
        });

        async function loadUsers() {
            const list = document.getElementById('usersList');
            const totalEl = document.getElementById('totalUsers');
            list.innerHTML = '';
            
            try {
                const snapshot = await db.collection('users').orderBy('lastSeen', 'desc').get();
                totalEl.innerText = snapshot.size;

                let html = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const email = data.email || "No Email";
                    const uid = doc.id;
                    
                    let joinedDate = "Old Data";
                    if (data.createdAt) {
                        const d = data.createdAt.toDate ? data.createdAt.toDate() : new Date(data.createdAt);
                        joinedDate = d.toLocaleDateString('en-IN');
                    }
                    const lastActive = data.lastSeen ? new Date(data.lastSeen.toDate()).toLocaleDateString() : "-";

                    html += `
                        <tr>
                            <td>
                                <strong style="color:#ffffff; font-size:0.95rem;">${email}</strong>
                                ${data.isVerified ? ' <span title="Verified" style="font-size:0.9rem;">✅</span>' : ''}
                            </td>
                            <td><span class="badge ${data.createdAt ? 'bg-green' : 'bg-gray'}">${joinedDate}</span></td>
                            <td style="color:#94a3b8;">${lastActive}</td>
                            <td>
                                <button onclick="spyUser('${uid}', '${email}')" class="btn-spy">
                                    View 👁️
                                </button>
                            </td>
                        </tr>
                    `;
                });
                list.innerHTML = html;

            } catch (error) {
                console.error(error);
                list.innerHTML = `<tr><td colspan="4" style="color:#f87171; text-align:center; padding:20px;">Error: ${error.message}</td></tr>`;
            }
        }

        window.spyUser = async (targetUid, targetEmail) => {
            const confirmed = window.glassConfirm 
                ? await window.glassConfirm("Inspect User Diary", `Access case records of ${targetEmail}?`, "View Records", false)
                : confirm(`View Diary of this user (${targetEmail})?`);

            if (confirmed) {
                window.location.href = `index.html?superuser=${targetUid}`;
            }
        };
    </script>
</body>
</html>
